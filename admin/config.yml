backend:
  name: github
  repo: ddkumar77-collab/ramya-website
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "bio"
    label: "Bio & Introduction"
    files:
      - file: "content/bio.json"
        label: "Bio Details"
        name: "bio_details"
        fields:
          - { label: "Hero Subtitle", name: "subtitle", widget: "string" }
          - { label: "Hero Headline", name: "headline", widget: "string" }
          - { label: "Bio Paragraph 1", name: "bioParagraph1", widget: "text" }
          - { label: "Bio Paragraph 2", name: "bioParagraph2", widget: "text" }

  - name: "events"
    label: "Speaking & Events"
    files:
      - file: "content/events.json"
        label: "Events List"
        name: "events_list"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            fields:
              - { label: "Category / Event Name", name: "category", widget: "string" }
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
